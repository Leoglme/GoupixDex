# Temporary: reads the API journal on the VPS (and optionally runs a read-only Python script from api/),
# then prints everything encrypted with the caller's RSA public key (the repo is public).

name: One-shot — API diagnostics (encrypted)

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'journalctl --since, e.g. "2026-10-03 17:30:00 UTC"'
        required: true
      until:
        description: 'journalctl --until, e.g. "2026-10-03 20:00:00 UTC"'
        required: true
      public_key_b64:
        description: 'Base64 of the RSA public key (PEM) that encrypts the output'
        required: true
      script_b64:
        description: 'Base64 of a read-only Python script run from api/ with the API venv (optional)'
        required: false
        default: ''

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Read the API journal and run the script (encrypted output)
        uses: appleboy/ssh-action@v1.0.3
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
          SCRIPT_B64: ${{ inputs.script_b64 }}
          API_SYSTEMD_SERVICE: ${{ secrets.API_SYSTEMD_SERVICE }}
          DEPLOY_API_DIR: ${{ secrets.DEPLOY_API_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SINCE,UNTIL,PUBLIC_KEY_B64,SCRIPT_B64,API_SYSTEMD_SERVICE,DEPLOY_API_DIR
          script: |
            WORK="$(mktemp -d)"
            SVC="${API_SYSTEMD_SERVICE:-goupixdex-api.service}"
            APP_ROOT="${DEPLOY_API_DIR%/}/api"
            echo "$PUBLIC_KEY_B64" | base64 -d > "$WORK/public.pem"
            sudo journalctl -u "$SVC" --since "$SINCE" --until "$UNTIL" --no-pager -o short-iso > "$WORK/out.txt" 2>&1 || true
            if [ -n "$SCRIPT_B64" ]; then
              echo "$SCRIPT_B64" | base64 -d > "$WORK/diagnostic.py"
              echo "===== SCRIPT OUTPUT =====" >> "$WORK/out.txt"
              (cd "$APP_ROOT" && "$APP_ROOT/.venv/bin/python" "$WORK/diagnostic.py") >> "$WORK/out.txt" 2>&1 || true
            fi
            wc -l "$WORK/out.txt"
            gzip -9 "$WORK/out.txt"
            openssl rand -hex 32 > "$WORK/key.txt"
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass "file:$WORK/key.txt" -in "$WORK/out.txt.gz" -out "$WORK/out.enc"
            openssl pkeyutl -encrypt -pubin -inkey "$WORK/public.pem" -pkeyopt rsa_padding_mode:oaep -in "$WORK/key.txt" -out "$WORK/key.enc"
            echo "KEY_BEGIN"
            base64 -w 76 "$WORK/key.enc"
            echo "KEY_END"
            echo "LOGS_BEGIN"
            base64 -w 76 "$WORK/out.enc"
            echo "LOGS_END"
            rm -rf "$WORK"
