name: Refresh catalog browse JSON

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: pip install httpx

      - name: Build catalog browse index
        run: python api/scripts/build_catalog_browse_index.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/catalog-index/
          if git diff --staged --quiet; then
            echo "Catalog index already up to date."
            exit 0
          fi
          git commit -m "chore(catalog): refresh static browse index"
          git push
