# Temporary: reads the API journal on the VPS and prints it encrypted with the caller's RSA public key (the repo is public).

name: One-shot — API logs (encrypted)

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'journalctl --since, e.g. "2026-09-27 11:20:00 UTC"'
        required: true
      until:
        description: 'journalctl --until, e.g. "2026-09-27 12:00:00 UTC"'
        required: true
      public_key_b64:
        description: 'Base64 of the RSA public key (PEM) that encrypts the output'
        required: true

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read the API journal (encrypted output)
        uses: appleboy/ssh-action@v1.0.3
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
          API_SYSTEMD_SERVICE: ${{ secrets.API_SYSTEMD_SERVICE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SINCE,UNTIL,PUBLIC_KEY_B64,API_SYSTEMD_SERVICE
          script: |
            WORK="$(mktemp -d)"
            SVC="${API_SYSTEMD_SERVICE:-goupixdex-api.service}"
            echo "$PUBLIC_KEY_B64" | base64 -d > "$WORK/public.pem"
            sudo journalctl -u "$SVC" --since "$SINCE" --until "$UNTIL" --no-pager -o short-iso > "$WORK/logs.txt" 2>&1 || true
            wc -l "$WORK/logs.txt"
            gzip -9 "$WORK/logs.txt"
            openssl rand -hex 32 > "$WORK/key.txt"
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass "file:$WORK/key.txt" -in "$WORK/logs.txt.gz" -out "$WORK/logs.enc"
            openssl pkeyutl -encrypt -pubin -inkey "$WORK/public.pem" -pkeyopt rsa_padding_mode:oaep -in "$WORK/key.txt" -out "$WORK/key.enc"
            echo "KEY_BEGIN"
            base64 -w 76 "$WORK/key.enc"
            echo "KEY_END"
            echo "LOGS_BEGIN"
            base64 -w 76 "$WORK/logs.enc"
            echo "LOGS_END"
            rm -rf "$WORK"
