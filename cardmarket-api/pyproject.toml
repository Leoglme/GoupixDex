[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardmarket-api"
version = "0.1.0"
description = "Local Cardmarket pricing API built on Cardmarket's public daily data files (no quota, no key)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.24"]

[tool.setuptools.packages.find]
include = ["cardmarket_api*"]
